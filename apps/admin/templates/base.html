<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>{% block title %}HART Admin Agent{% endblock %}</title>
  <link rel="icon" type="image/svg+xml" href="{{ url_for('admin.static', filename='img/favicon.svg') }}">
  <link rel="stylesheet" href="{{ url_for('admin.static', filename='css/style.css') }}">
</head>
<body>
  <header class="topbar">
    <a class="brand" href="{{ url_for('admin.landing') }}">HART <span>Admin Agent</span></a>
    <nav>
      {% if g.user %}
        <a href="{{ url_for('admin.dashboard') }}">Dashboard</a>
        <span class="muted">{{ g.user['name'] }}</span>
        <form method="post" action="{{ url_for('admin.logout') }}" class="inline">
          <button type="submit" class="btn btn-ghost">Logout</button>
        </form>
      {% else %}
        <a class="btn" href="{{ url_for('admin.login') }}">Login</a>
      {% endif %}
    </nav>
  </header>

  <main class="container">
    {% with messages = get_flashed_messages(with_categories=true) %}
      {% for category, message in messages %}
        <div class="flash flash-{{ category }}">{{ message }}</div>
      {% endfor %}
    {% endwith %}

    {% block content %}{% endblock %}
  </main>
</body>
</html>
